    <style>
        :root {

        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.2s, border 0.3s; }
        body {
            font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: var(--text-light);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, var(--primary-glow) 0%, transparent 40%);
        }
        .container {
            max-width: 950px; width: 100%; background: var(--bg-card); padding: 40px; border-radius: 40px;
            border: 1px solid var(--border-color); box-shadow: var(--card-shadow); text-align: center;

        .container::before {
            content: "🌐"; position: absolute; bottom: -30px; left: -20px; font-size: 7rem;
            opacity: 0.04; z-index: 0; pointer-events: none;

            position: absolute; top: 20px; left: 20px; background: var(--bg-input); border: 1px solid var(--border-color);

            padding: 16px 30px; border: none; border-radius: 18px;

        .btn-generate:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--primary-glow); }
        .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; transform: none; filter: grayscale(0.5); }

        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0 20px; }

        #searchInput {
            width: 100%; max-width: 350px; padding: 12px; border-radius: 12px; background: var(--bg-input);
            border: 1px solid var(--border-color); color: var(--text-light); font-family: 'Cairo'; text-align: center;

        .domains-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px;
            margin-top: 20px; max-height: 500px; overflow-y: auto; padding: 5px;

        .domains-grid::-webkit-scrollbar { width: 8px; }
        .domains-grid::-webkit-scrollbar-track { background: var(--bg-input); border-radius: 10px; }

        .domain-item {
            background: var(--bg-input); padding: 16px 10px; border-radius: 14px; border: 1px solid var(--border-color);
            font-size: 0.95rem; font-family: 'Orbitron', 'Cairo', monospace; color: var(--text-light);
            transition: 0.3s; cursor: pointer; position: relative; text-align: center; word-break: break-all;
        }
        .domain-item:hover { border-color: var(--secondary); background: rgba(0, 204, 255, 0.05); transform: translateY(-3px); }
        .domain-item .domain-name { color: var(--primary); font-weight: 700; }
        .domain-item.copied { animation: pop 0.3s ease; border-color: var(--primary); background: rgba(124, 58, 237, 0.1); }

        @media (max-width: 600px) {

            input { width: 100%; }

<body>
    <div class="progress-bar" id="progressBar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    
    <div class="container">
        <button class="theme-toggle" onclick="app.toggleTheme()" title="تبديل الوضع" aria-label="تبديل الوضع">🌓</button>
        <h1>🌐 مولد أسماء النطاقات</h1>
        <p class="sub">أدخل الكلمة الرئيسية (بالإنجليزية)، ودعنا نصنع لك عشرات الأفكار المميزة لنطاقك الجديد.</p>

        <div class="input-group">
            <input type="text" id="keywordInput" placeholder="مثلاً: mybrand, tech, store..." value="mybrand" aria-label="الكلمة الرئيسية للنطاق">
            <button class="btn-generate" id="generateBtn" onclick="app.generateDomains()" aria-busy="false">
                <i class="fas fa-globe"></i> توليد النطاقات
            </button>
        </div>

        <div class="toolbar">
            <button class="btn-tool" onclick="app.copyAllDomains()"><i class="fas fa-copy"></i> نسخ الكل</button>
            <button class="btn-tool" onclick="app.exportCSV()"><i class="fas fa-file-csv"></i> CSV</button>
            <button class="btn-tool" onclick="app.exportTXT()"><i class="fas fa-file-alt"></i> TXT</button>
            <button class="btn-tool" onclick="app.saveDomains()"><i class="fas fa-save"></i> حفظ</button>
            <button class="btn-tool" onclick="app.downloadImage()"><i class="fas fa-image"></i> صورة</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 تصفية النطاقات..." oninput="app.filterDomains()" aria-label="بحث في النطاقات">
        </div>

        <div id="domainsGrid" class="domains-grid" role="list" aria-live="polite" aria-label="قائمة النطاقات المولدة"></div>
        <div class="counter" id="domainCounter">تم توليد 0 نطاقاً</div>
    </div>

<script>
/**
 * المحرك الأسطوري لتوليد أسماء النطاقات
 * Optimized for: Extreme Speed, Max SEO, AI Crawler Compatibility, Zero UI Blocking
 */
class DomainGeneratorEngine {
    constructor() {
        this.domainCount = parseInt(localStorage.getItem('totalDomainsGenerated') || '0');
        this.usedDomains = new Set(JSON.parse(localStorage.getItem('usedDomainsHash') || '[]'));
        this.allDomains = [];
        this.initTheme();

        this.prefixes = ['get', 'go', 'my', 'app', 'try', 'the', 'pro', 'neo', 'ultra', 'smart', 'cloud', 'top', 'best', 'new', 'digital', 'cyber', 'next', 'hyper', 'omni', 'meta', 'alpha', 'prime', 'elite', 'super', 'max', 'flex', 'sync', 'pixel', 'nova', 'zen', 'flow', 'rise', 'core', 'hub', 'net', 'web', 'tech', 'data', 'code', 'byte'];
        this.suffixes = ['hub', 'lab', 'zone', 'io', 'ai', 'tech', 'pro', 'online', 'solutions', 'fy', 'x', 'systems', 'works', 'me', 'ly', 'ster', 'able', 'wise', 'ful', 'less', 'box', 'kit', 'base', 'space', 'world', 'pad', 'bit', 'byte', 'gen', 'ify', 'ora', 'ica', 'ous', 'ium', 'est', 'ist', 'er', 'ed', 'ing'];
        this.tlds = [
            { tld: '.com', popular: true }, { tld: '.net', popular: true }, { tld: '.org', popular: false },
            { tld: '.io', popular: true }, { tld: '.co', popular: true }, { tld: '.ai', popular: true },
            { tld: '.tech', popular: true }, { tld: '.cloud', popular: true }, { tld: '.online', popular: false },
            { tld: '.pro', popular: false }, { tld: '.dev', popular: true }, { tld: '.app', popular: true },
            { tld: '.me', popular: true }, { tld: '.sa', popular: false }, { tld: '.ae', popular: false },
            { tld: '.store', popular: false }, { tld: '.shop', popular: true }, { tld: '.site', popular: false },
            { tld: '.xyz', popular: false }, { tld: '.info', popular: false }
        ];
    }

    getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    updateCounter() {
        document.getElementById('domainCounter').textContent = `تم توليد ${this.domainCount} نطاقاً`;
    }

    initTheme() {
        if (localStorage.getItem('domainTheme') === 'light') document.body.classList.add('light-mode');
    }

    toggleTheme() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('domainTheme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    showToast(message) {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s';
            setTimeout(() => toast.remove(), 500);
        }, 2500);
    }

    updateSchema(keyword) {
        const schema = {
            "@context": "https://schema.org",
            "@type": "SoftwareApplication",
            "name": `أفكار نطاقات لـ ${keyword}`,
            "description": `قائمة مقترحة لأسماء نطاقات مميزة للكلمة الرئيسية: ${keyword}`,
            "applicationCategory": "UtilityApplication"
        };
        const scriptTag = document.getElementById('dynamic-schema');
        if (scriptTag) scriptTag.textContent = JSON.stringify(schema);
    }

    generateDomains() {
        const keywordInput = document.getElementById('keywordInput').value.trim();
        const generateBtn = document.getElementById('generateBtn');
        const progressBar = document.getElementById('progressBar');

        if (!keywordInput) {
            this.showToast('⚠️ يرجى كتابة كلمة رئيسية أولاً!');
            return;
        }

        // أسماء النطاقات يجب أن تكون بالإنجليزية والأرقام فقط
        const clean = keywordInput.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
        if (clean.length < 2) {
            this.showToast('⚠️ الكلمة قصيرة جداً أو تحتوي على أحرف غير مدعومة (استخدم الإنجليزية والأرقام فقط).');
            return;
        }

        generateBtn.disabled = true;
        generateBtn.setAttribute('aria-busy', 'true');
        progressBar.style.width = '30%';

        setTimeout(() => {
            try {
                let generated = [];
                let attempts = 0;
                const targetCount = 30;

                const variations = [clean];
                if (clean.length > 4) variations.push(clean.substring(0, Math.floor(clean.length / 2)));
                if (clean.length > 5) variations.push(clean.substring(0, 3) + clean.substring(clean.length - 2));

                while (generated.length < targetCount && attempts < 500) {
                    const base = this.getRandom(variations);
                    let name;
                    const pattern = Math.floor(Math.random() * 4);

                    if (pattern === 0) {
                        name = this.getRandom(this.prefixes) + base;
                    } else if (pattern === 1) {
                        name = base + this.getRandom(this.suffixes);
                    } else if (pattern === 2) {
                        name = this.getRandom(this.prefixes) + base + this.getRandom(this.suffixes);
                    } else {
                        name = base;
                    }

                    // التأكد من أن الاسم لا يبدأ أو ينتهي بواصلة (رغم أننا لا نستخدمها هنا، احتياطاً)
                    name = name.replace(/^-+|-+$/g, '');

                    const tld = this.getRandom(this.tlds);
                    const fullDomain = name + tld.tld;

                    if (!this.usedDomains.has(fullDomain)) {
                        this.usedDomains.add(fullDomain);
                        generated.push({ domain: fullDomain, popular: tld.popular });
                    }
                    attempts++;
                }

                // تنظيف الذاكرة بشكل دوري
                if (this.usedDomains.size > 2000) {
                    const arr = Array.from(this.usedDomains);
                    this.usedDomains = new Set(arr.slice(-1000));
                }
                try { localStorage.setItem('usedDomainsHash', JSON.stringify(Array.from(this.usedDomains))); } catch(e) {}

                this.allDomains = generated;
                this.domainCount += generated.length;
                try { localStorage.setItem('totalDomainsGenerated', this.domainCount); } catch(e) {}
                
                this.updateCounter();
                this.renderDomains(this.allDomains);
                this.updateSchema(clean);
                
                document.getElementById('searchInput').value = '';
                progressBar.style.width = '100%';
                setTimeout(() => { progressBar.style.width = '0%'; }, 300);
                
                this.showToast(`✅ تم توليد ${generated.length} نطاقاً مميزاً!`);
            } catch (error) {
                this.showToast('❌ حدث خطأ أثناء التوليد');
                console.error(error);
            } finally {
                generateBtn.disabled = false;
                generateBtn.setAttribute('aria-busy', 'false');
            }
        }, 50);
    }

    // ⚡ عرض سريع باستخدام DocumentFragment لمنع تجميد المتصفح
    renderDomains(list) {
        const grid = document.getElementById('domainsGrid');
        grid.innerHTML = '';
        const fragment = document.createDocumentFragment();
        
        list.forEach(item => {
            const div = document.createElement('div');
            div.className = 'domain-item';
            div.setAttribute('role', 'listitem');
            div.setAttribute('tabindex', '0');
            div.innerHTML = `
                <span class="domain-name">${item.domain}</span>
                <span class="availability ${item.popular ? '' : 'taken'}" title="${item.popular ? 'نطاق شائع ومميز' : 'نطاق متاح'}">
                    ${item.popular ? '★' : '✓'}
                </span>
            `;
            div.onclick = () => this.copySingle(item.domain, div);
            div.onkeydown = (e) => { if (e.key === 'Enter') this.copySingle(item.domain, div); };
            fragment.appendChild(div);
        });
        grid.appendChild(fragment);
        
        document.getElementById('domainCounter').textContent = `عرض ${list.length} نطاقاً`;
    }

    filterDomains() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!query) {
            this.renderDomains(this.allDomains);
            return;
        }
        const filtered = this.allDomains.filter(d => d.domain.toLowerCase().includes(query));
        this.renderDomains(filtered);
    }

    copySingle(domain, element) {
        navigator.clipboard.writeText(domain).then(() => {
            if (element) {
                element.classList.add('copied');
                const originalHTML = element.innerHTML;
                element.innerHTML = `<span style="color:var(--primary); font-weight:900;">✓ تم النسخ!</span>`;
                setTimeout(() => {
                    element.classList.remove('copied');
                    element.innerHTML = originalHTML;
                }, 800);
            }
            this.showToast(`✅ تم نسخ: ${domain}`);
        }).catch(() => this.showToast('❌ فشل النسخ'));
    }

    copyAllDomains() {
        if (this.allDomains.length === 0) { this.showToast('⚠️ لا توجد نطاقات لنسخها'); return; }
        navigator.clipboard.writeText(this.allDomains.map(d => d.domain).join('\n')).then(() => {
            this.showToast('✅ تم نسخ جميع النطاقات للحافظة!');
        }).catch(() => this.showToast('❌ فشل النسخ'));
    }

    exportCSV() {
        if (this.allDomains.length === 0) { this.showToast('⚠️ لا توجد بيانات للتصدير'); return; }
        // إضافة BOM لدعم اللغة العربية بشكل صحيح في Excel
        const csv = '\uFEFFDomain,Popular\n' + this.allDomains.map(d => `"${d.domain}","${d.popular ? 'Yes' : 'No'}"`).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'domains_ideas.csv';
        link.click();
        URL.revokeObjectURL(link.href);
        this.showToast('✅ تم تصدير ملف CSV بنجاح!');
    }

    exportTXT() {
        if (this.allDomains.length === 0) { this.showToast('⚠️ لا توجد بيانات للتصدير'); return; }
        const blob = new Blob([this.allDomains.map(d => d.domain).join('\n')], { type: 'text/plain;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'domains_ideas.txt';
        link.click();
        URL.revokeObjectURL(link.href);
        this.showToast('✅ تم تصدير ملف TXT بنجاح!');
    }

    saveDomains() {
        if (this.allDomains.length === 0) { this.showToast('⚠️ لا توجد نطاقات لحفظها'); return; }
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('domainLibrary') || '[]'); } catch (e) { saved = []; }
        
        const newItems = this.allDomains.map(d => ({ 
            domain: d.domain, 
            popular: d.popular, 
            date: new Date().toLocaleString('ar-SA') 
        }));
        
        try {
            localStorage.setItem('domainLibrary', JSON.stringify([...newItems, ...saved].slice(0, 100)));
            this.showToast('💾 تم حفظ النطاقات في المكتبة بنجاح!');
        } catch (e) {
            if (e.name === 'QuotaExceededError') this.showToast('❌ مساحة التخزين ممتلئة!');
            else this.showToast('❌ حدث خطأ أثناء الحفظ.');
        }
    }

    downloadImage() {
        if (typeof html2canvas === 'undefined') {
            this.showToast('⏳ جاري تحميل مكتبة الصور، حاول مرة أخرى بعد ثانية.');
            return;
        }
        this.showToast('⏳ جاري تحويل النطاقات إلى صورة...');
        const grid = document.getElementById('domainsGrid');
        const isDark = !document.body.classList.contains('light-mode');
        
        html2canvas(grid, { 
            backgroundColor: isDark ? '#1b1728' : '#ede4fc',
            scale: 2,
            logging: false
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `نطاقات_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            this.showToast('✅ تم تحميل الصورة بنجاح!');
        }).catch(() => this.showToast('❌ فشل إنشاء الصورة.'));
    }
}

// تهيئة التطبيق
const app = new DomainGeneratorEngine();
window.onload = function() {
    // توليد أولي آمن
    try { app.generateDomains(); } catch (e) { console.error('فشل التوليد الأولي:', e); }
};
</script>
