        <div class="input-group">
            <input type="text" id="brandName" placeholder="مثلاً: لؤلؤة الشرق" value="لؤلؤة الشرق" aria-label="اسم العلامة التجارية">
            <select id="brandVibe" aria-label="نمط العلامة التجارية">

            <button class="btn-generate" id="generateBtn" onclick="app.generateSlogans()" aria-busy="false">

            <button class="btn-tool" onclick="app.copyAllSlogans()"><i class="fas fa-copy"></i> نسخ الكل</button>
            <button class="btn-tool" onclick="app.exportSlogans()"><i class="fas fa-file-alt"></i> تصدير TXT</button>
            <button class="btn-tool" onclick="app.saveSlogans()"><i class="fas fa-save"></i> حفظ في المكتبة</button>
            <button class="btn-tool" onclick="app.downloadSlogansImage()"><i class="fas fa-image"></i> تحميل كصورة</button>
        </div>

        <div id="sloganGrid" class="slogan-grid" role="list" aria-live="polite" aria-label="قائمة الشعارات المولدة"></div>
        <div class="counter" id="sloganCounter">تم توليد 0 شعاراً فاخراً</div>
    </div>

<script>
/**
 * المحرك الأسطوري لتوليد شعارات العلامات التجارية الفاخرة
 * Optimized for: Extreme Speed, Max SEO, AI Crawler Compatibility, Smart Vibe Matching
 */
class SloganEngine {
    constructor() {
        this.sloganCount = parseInt(localStorage.getItem('totalSlogansGenerated') || '0');
        this.usedSlogans = new Set(JSON.parse(localStorage.getItem('usedSlogansHash') || '[]'));
        this.currentSlogans = [];
        this.currentBrand = '';
        this.updateCounter();
        this.initTheme();

        // 🧠 قاموس ذكي مقسم حسب نمط العلامة التجارية لضمان دقة المعنى
        this.vibes = {
            luxury: {
                concepts: ['الفخامة', 'الأناقة', 'الرقي', 'التميز', 'الأصالة', 'الإرث'],
                verbs: ['نصوغ', 'نرتقي', 'نمنح', 'نرسخ', 'ننسج', 'نصنع'],
                values: ['نهجك', 'أسلوبك', 'بصمتك', 'عالمك', 'تفردك'],
                fixed: ['حيث تلتقي الفخامة بالإتقان', 'الأناقة ليست خياراً، بل أسلوب حياة', 'ننسج أحلامك بأيدٍ من ذهب']
            },
            tech: {
                concepts: ['المستقبل', 'الابتكار', 'الذكاء', 'التطور', 'الحلول', 'السرعة'],
                verbs: ['نبتكر', 'نبرمج', 'نقود', 'نتجاوز', 'نطور', 'نحلّق'],
                values: ['مستقبلك', 'طموحك', 'رحلتك', 'تفردك', 'نجاحك'],
                fixed: ['نصنع الغد، اليوم', 'تقنية تتفهم احتياجاتك', 'الابتكار في كل تفصيل']
            },
            youth: {
                concepts: ['الحيوية', 'الشغف', 'الجرأة', 'الإلهام', 'الحركة', 'التمرد'],
                verbs: ['نلهم', 'نشتعل', 'نكسر', 'نرسم', 'نحقق', 'ننطلق'],
                values: ['حلمك', 'قصتك', 'لحظتك', 'عالمك', 'صوتك'],
                fixed: ['أكثر من مجرد علامة، نحن حركة', 'اصنع قصتك الخاصة', 'طاقة لا تتوقف']
            },
            trust: {
                concepts: ['الأمان', 'الثقة', 'الشفافية', 'الجودة', 'الاستقرار', 'الالتزام'],
                verbs: ['نضمن', 'نحافظ', 'نبني', 'نرعى', 'نخدم', 'نلتزم'],
                values: ['راحة بالك', 'مستقبلك', 'عائلتك', 'استثمارك', 'ثقتك'],
                fixed: ['ثقتك هي رأس مالنا', 'جودة تراها، وأمان تشعر به', 'شريكك في كل خطوة']
            },
            eco: {
                concepts: ['الاستدامة', 'الطبيعة', 'النقاء', 'التوازن', 'المسؤولية', 'الأخضر'],
                verbs: ['نحافظ', 'نزرع', 'نحمي', 'نجدد', 'ننقي', 'نهتم'],
                values: ['كوكبنا', 'مستقبلنا', 'أطفالنا', 'بيئتنا', 'حياتنا'],
                fixed: ['نزرع اليوم، لنحصد غداً', 'طبيعة في كل تفصيل', 'من أجل كوكب أنقى']
            }
        };

        // قوالب تركيب ذكية
        this.templates = [
            (b, v, c, val) => `${b}... ${c} ${v}`,
            (b, v, c, val) => `مع ${b}، ${c} يصبح ${val}`,
            (b, v, c, val) => `${v} ${c}، لنمنحك ${val}`,
            (b, v, c, val) => `${b}: حيث ${v} ${c}`,
            (b, v, c, val) => `أكثر من مجرد ${c}، نحن ${b}`
        ];
    }

    getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    updateCounter() {
        document.getElementById('sloganCounter').textContent = `تم توليد ${this.sloganCount} شعاراً فاخراً`;
    }

    initTheme() {
        if (localStorage.getItem('sloganTheme') === 'light') document.body.classList.add('light-mode');
    }

    toggleTheme() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('sloganTheme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    // 🚀 تحديث ديناميكي لعناوين SEO لالتقاط المحتوى الجديد فوراً
    updateDynamicSEO(brand, vibe) {
        document.title = `شعارات فاخرة لـ ${brand} | مولد العلامات التجارية`;
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) {
            metaDesc.content = `شعارات إعلانية فاخرة ومبتكرة لـ "${brand}" بنمط ${vibe}. ولّد شعارات قصيرة ومؤثرة لهويتك البصرية مجاناً.`;
        }
        const schema = {
            "@context": "https://schema.org",
            "@type": "CreativeWork",
            "name": `شعارات لـ ${brand}`,
            "description": `مجموعة شعارات إعلانية فاخرة بنمط ${vibe} للعلامة التجارية ${brand}.`,
            "creator": { "@type": "Organization", "name": "الأدوات المطلقة" },
            "inLanguage": "ar"
        };
        const scriptTag = document.getElementById('dynamic-schema');
        if (scriptTag) scriptTag.textContent = JSON.stringify(schema);
    }

    showToast(message) {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s';
            setTimeout(() => toast.remove(), 500);
        }, 2500);
    }

    generateSingleSlogan(brand, vibeData) {
        const verb = this.getRandom(vibeData.verbs);
        const concept = this.getRandom(vibeData.concepts);
        const value = this.getRandom(vibeData.values);
        const template = this.getRandom(this.templates);
        return template(brand, verb, concept, value).replace(/\s+/g, ' ').trim();
    }

    generateSlogans(isRefresh = false, indexToRefresh = -1) {
        const brand = document.getElementById('brandName').value.trim();
        const vibeKey = document.getElementById('brandVibe').value;
        const vibeData = this.vibes[vibeKey];
        
        if (!brand) {
            this.showToast('⚠️ يرجى كتابة اسم العلامة التجارية أولاً!');
            return;
        }

        this.currentBrand = brand;
        const grid = document.getElementById('sloganGrid');
        const generateBtn = document.getElementById('generateBtn');
        const progressBar = document.getElementById('progressBar');

        if (!isRefresh) {
            grid.innerHTML = '';
            generateBtn.disabled = true;
            generateBtn.setAttribute('aria-busy', 'true');
            progressBar.style.width = '30%';
        }

        setTimeout(() => {
            try {
                if (!isRefresh) {
                    let generated = [];
                    let attempts = 0;
                    const targetCount = 6;

                    do {
                        let slogan, tag;
                        if (Math.random() < 0.3) {
                            slogan = `${brand}: ${this.getRandom(vibeData.fixed)}`;
                            tag = '✨ كلاسيكي';
                        } else {
                            slogan = this.generateSingleSlogan(brand, vibeData);
                            const tagPool = ['🔥 تحفيزي', '💎 فاخر', '⚡ تقني', '❤️ عاطفي', '🌟 ملهم'];
                            tag = this.getRandom(tagPool);
                        }

                        const hash = slogan.replace(/\s/g, '');
                        if (!this.usedSlogans.has(hash)) {
                            this.usedSlogans.add(hash);
                            generated.push({ text: slogan, tag: tag });
                        }
                        attempts++;
                    } while (generated.length < targetCount && attempts < 200);

                    if (this.usedSlogans.size > 1000) {
                        const arr = Array.from(this.usedSlogans);
                        this.usedSlogans = new Set(arr.slice(-500));
                    }
                    try { localStorage.setItem('usedSlogansHash', JSON.stringify(Array.from(this.usedSlogans))); } catch(e) {}

                    this.currentSlogans = generated;
                    this.renderSlogans(this.currentSlogans);
                    progressBar.style.width = '100%';
                    setTimeout(() => { progressBar.style.width = '0%'; }, 300);
                } else if (indexToRefresh >= 0) {
                    let newSlogan, hash;
                    let attempts = 0;
                    do {
                        newSlogan = Math.random() < 0.3 
                            ? `${brand}: ${this.getRandom(vibeData.fixed)}`
                            : this.generateSingleSlogan(brand, vibeData);
                        hash = newSlogan.replace(/\s/g, '');
                        attempts++;
                    } while (this.usedSlogans.has(hash) && attempts < 50);
                    
                    this.usedSlogans.add(hash);
                    const tagPool = ['🔥 تحفيزي', '💎 فاخر', '⚡ تقني', '❤️ عاطفي', '🌟 ملهم'];
                    this.currentSlogans[indexToRefresh] = { text: newSlogan, tag: this.getRandom(tagPool) };
                    this.renderSlogans(this.currentSlogans);
                }

                this.sloganCount += isRefresh ? 0 : 6;
                try { localStorage.setItem('totalSlogansGenerated', this.sloganCount); } catch(e) {}
                this.updateCounter();
                
                this.updateDynamicSEO(this.currentBrand, vibeKey);
            } catch (error) {
                this.showToast('❌ حدث خطأ أثناء التوليد');
                console.error(error);
            } finally {
                generateBtn.disabled = false;
                generateBtn.setAttribute('aria-busy', 'false');
            }
        }, isRefresh ? 0 : 400);
    }

    renderSlogans(list) {
        const grid = document.getElementById('sloganGrid');
        grid.innerHTML = '';
        const fragment = document.createDocumentFragment();
        
        list.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'slogan-card';
            card.setAttribute('role', 'listitem');
            card.innerHTML = `
                <div style="flex:1;">
                    <div class="slogan-text">${item.text}</div>
                    <span class="slogan-tag">${item.tag}</span>
                </div>
                <div class="card-actions">
                    <div class="refresh-btn-circle" onclick="event.stopPropagation(); app.generateSlogans(true, ${index})" title="تحديث هذا الشعار" aria-label="تحديث الشعار">
                        <i class="fas fa-sync-alt"></i>
                    </div>
                    <div class="copy-btn-circle" onclick="event.stopPropagation(); app.copySingle('${item.text.replace(/'/g, "\\'")}', this.closest('.slogan-card'))" title="نسخ الشعار" aria-label="نسخ الشعار">
                        <i class="far fa-copy"></i>
                    </div>
                </div>
            `;
            card.onclick = () => this.copySingle(item.text, card);
            fragment.appendChild(card);
        });
        grid.appendChild(fragment);
    }

    copySingle(text, element) {
        navigator.clipboard.writeText(text).then(() => {
            if (element) {
                element.classList.add('copied');
                const originalIcon = element.querySelector('.copy-btn-circle i').className;
                element.querySelector('.copy-btn-circle i').className = 'fas fa-check';
                setTimeout(() => {
                    element.classList.remove('copied');
                    element.querySelector('.copy-btn-circle i').className = originalIcon;
                }, 800);
            }
            this.showToast('✅ تم نسخ الشعار بنجاح!');
        }).catch(() => this.showToast('❌ فشل النسخ'));
    }

    copyAllSlogans() {
        if (this.currentSlogans.length === 0) { this.showToast('⚠️ لا توجد شعارات لنسخها'); return; }
        navigator.clipboard.writeText(this.currentSlogans.map(s => s.text).join('\n')).then(() => {
            this.showToast('✅ تم نسخ جميع الشعارات للحافظة!');
        }).catch(() => this.showToast('❌ فشل النسخ'));
    }

    exportSlogans() {
        if (this.currentSlogans.length === 0) { this.showToast('⚠️ لا توجد بيانات للتصدير'); return; }
        const content = '\uFEFF' + this.currentSlogans.map(s => s.text).join('\n');
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `شعارات_${this.currentBrand || 'فاخرة'}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
        this.showToast('✅ تم تصدير الملف بنجاح!');
    }

    saveSlogans() {
        if (this.currentSlogans.length === 0) { this.showToast('⚠️ لا توجد شعارات لحفظها'); return; }
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('sloganLibrary') || '[]'); } catch (e) { saved = []; }
        
        const newItems = this.currentSlogans.map(s => ({ 
            text: s.text, tag: s.tag, brand: this.currentBrand, date: new Date().toLocaleString('ar-SA') 
        }));
        
        try {
            localStorage.setItem('sloganLibrary', JSON.stringify([...newItems, ...saved].slice(0, 50)));
            this.showToast('💾 تم حفظ الشعارات في المكتبة بنجاح!');
        } catch (e) {
            if (e.name === 'QuotaExceededError') this.showToast('❌ مساحة التخزين ممتلئة!');
            else this.showToast('❌ حدث خطأ أثناء الحفظ.');
        }
    }

    downloadSlogansImage() {
        if (typeof html2canvas === 'undefined') {
            this.showToast('⏳ جاري تحميل مكتبة الصور، حاول مرة أخرى بعد ثانية.');
            return;
        }
        this.showToast('⏳ جاري تحويل الشعارات إلى صورة...');
        const grid = document.getElementById('sloganGrid');
        const isDark = !document.body.classList.contains('light-mode');
        
        html2canvas(grid, { 
            backgroundColor: isDark ? '#1a140f' : '#ffffff',
            scale: 2,
            logging: false
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `شعارات_${this.currentBrand || 'فاخرة'}_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            this.showToast('✅ تم تحميل الصورة بنجاح!');
        }).catch(() => this.showToast('❌ فشل إنشاء الصورة.'));
    }
}

// تهيئة التطبيق
const app = new SloganEngine();
window.onload = function() {
    app.generateSlogans();
};
</script>
