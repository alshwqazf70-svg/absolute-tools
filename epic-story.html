    detectGender(name) {
        const maleExceptions = ['حمزة','معاوية','عيسى','مصطفى','موسى','هولمز','جاك','ماكس','فيكتور','داميان','ثورين','ألدريك','كايل','زين','أدريان','لوكا','مارلو'];
        if (maleExceptions.includes(name)) return 'male';
        const femaleEndings = ['ة', 'ى', 'ا'];
        const lastChar = name.charAt(name.length - 1);
        if (femaleEndings.includes(lastChar)) return 'female';
        const femaleNames = ['سيلفيا', 'إيفا', 'نوفا', 'لارا', 'صوفيا', 'إيزابيلا', 'فيرونيكا', 'أجاثا', 'لوسي', 'إيميليا', 'إليانا', 'أوريون', 'فالنتينا'];
        if (femaleNames.includes(name)) return 'female';
        return 'male';
    }

    generateEpicStory() {
        const wordInput = document.getElementById('epicWord');
        const word = wordInput.value.trim();
        if (!word) { 
            wordInput.style.borderColor = '#ff4757';
            setTimeout(() => wordInput.style.borderColor = '', 2000);
            return; 
        }
        
        const genre = document.getElementById('genreSelect').value;
        let heroName = document.getElementById('heroName').value.trim();

        const loader = document.getElementById('loader');

        actionButtons.style.display = 'none';
        loader.style.display = 'block';
        generateBtn.disabled = true;
        generateBtn.setAttribute('aria-busy', 'true');

        setTimeout(() => {
            const pool = this.narrativeDB[genre] || this.narrativeDB.fantasy;
            if (!heroName) { 
                const rand = this.getRandom(this.defaultNames[genre] || this.defaultNames.fantasy); 
                heroName = rand.name; 
            }
            
            const p = this.getPronouns(this.detectGender(heroName));
            const secondNames = p.isFemale ? ['أدريان','لوكا','سيباستيان','كايل'] : ['إيزابيلا','صوفيا','فالنتينا','نوفا'];
            const name2 = this.getRandom(secondNames);

            const currentSetting = this.getRandom(pool.settings);
            const mentor = this.getRandom(pool.mentors);
            const object = this.getRandom(pool.objects);
            const twist = this.getRandom(pool.twists);
            const climax = this.getRandom(pool.climaxes);
            const ending = this.getRandom(pool.endings);
            const mentorShort = mentor.name.split(' ')[0];
            
            const expansion1 = this.getRandom(this.expansionPhrases.intro);
            const expansion2 = this.getRandom(this.expansionPhrases.middle);
            const expansion3 = this.getRandom(this.expansionPhrases.preClimax);

            const twistText = twist.replace(/\$\{p\.subject\}/g, p.subject).replace(/\$\{p\.object\}/g, p.object).replace(/\$\{name\}/g, heroName).replace(/\$\{name2\}/g, name2).replace(/\$\{word\}/g, word);
            const climaxText = climax.replace(/\$\{name\}/g, heroName).replace(/\$\{word\}/g, word);
            const endingText = ending.replace(/\$\{p\.subject\}/g, p.subject).replace(/\$\{name\}/g, heroName).replace(/\$\{name2\}/g, name2);

            let story = `الفصل الأول: صدى البداية\n\n`;
            story += `${expansion1} في ${currentSetting.name}، ${currentSetting.desc}، ${p.was} هناك ${heroName}. لم ${p.not} ${heroName} شخصاً عادياً؛ فقد ${p.had} سراً عميقاً في قلب${p.possessive}، و${p.was} يرى في أحلام${p.possessive} رؤى لا يستطيع تفسيرها. ${p.felt} دائماً أن هناك شيئاً ينادي${p.object} من بعيد، شيئاً يتعلق بـ "${word}".\n\n`;
            
            story += `الفصل الثاني: الاستدعاء والرحلة\n\n`;
            story += `ذات ليلة، بينما ${p.was} ${heroName} ${p.wanders} وحيداً تحت ضوء القمر، عثر بالصدفة على ${object.name}. ${object.desc}. في البداية، لم ${p.cares} ${p.subject} الأمر اهتماماً، لكن سرعان ما اكتشف ${p.subject} أن هذا الشيء ليس عادياً على الإطلاق. ${p.was} ينبض بطاقة غريبة، وكأنه حي.\n\n`;
            story += `${expansion2} ومنذ تلك اللحظة، تغير كل شيء. بدأت أحداث غريبة تحدث من حول${p.object}: أشياء تتحرك وحدها، أصوات تهمس في الظلام، وظلال تطارد${p.object} أينما ${p.goes}.\n\n`;
            story += `في إحدى الليالي، بينما ${p.was} ${heroName} يحاول فك لغز ${object.name}، ظهر له فجأة ${mentor.name}. ${mentor.desc}. ${p.was} اللقاء مربكاً في البداية، لكن ${heroName} سرعان ما أدرك أن هذا الكائن ليس عدواً، بل يحاول إيصال رسالة مهمة. ${p.told_him} ${mentorShort} بصوت يشبه حفيف أوراق الخريف أن "${word}" هو مفتاح كل شيء. قال له: "لقد تم اختيارك منذ زمن بعيد. ${word} ليس مجرد كلمة، بل هو قدرك الذي لا مفر منه".\n\n`;
            
            story += `الفصل الثالث: التصاعد والذروة\n\n`;
            story += `انطلق ${heroName} في رحلة طويلة وشاقة، لم ${p.not} ${p.knows} إلى أين ${p.leads}. عبر خلالها جبالاً شامخة وأنهاراً هادرة. التقى خلال رحلته بشخصيات غريبة: بعضها ساعد${p.object}، وبعضها حاول إيقاف${p.object}. لكن ${heroName} كان ${p.designed} على معرفة الحقيقة مهما كلف الثمن. ${p.repeats} في داخل${p.possessive}: "${word}... ماذا تعنين؟".\n\n`;
            story += `${expansion3}\n\n`;
            story += `${twistText}\n\n`;
            story += `${climaxText}\n\n`;
            
            story += `الفصل الرابع: الخاتمة والصدى\n\n`;
            story += `عندها فقط أدرك ${heroName} أن "${word}" ليس مجرد كلمة عابرة، بل هو سر الوجود نفسه. إنه الخيط الذي يربط كل شيء ببعضه. تجمعت كل الخيوط المتفرقة معاً، وشعر ${heroName} بقوة هائلة تتدفق في عروق${p.possessive}.\n\n`;
            story += `${endingText}`;

            const signature = `${genre}|${heroName}|${currentSetting.name}|${object.name}|${twist.substring(0, 30)}`;
            let attempts = 0;
            while (this.storyHistory.has(signature) && attempts < 50) {
                attempts++;
            }
            this.storyHistory.add(signature);
            if (this.storyHistory.size > 500) this.storyHistory.clear();

            outputBox.textContent = '';
            outputBox.classList.add('show');
            loader.style.display = 'none';
            generateBtn.disabled = false;
            generateBtn.setAttribute('aria-busy', 'false');
            
            this.typeWriterEffect(story, outputBox);

            this.storyCount++;
            localStorage.setItem('totalStoriesGenerated', this.storyCount);
            this.updateCounter();
            actionButtons.style.display = 'flex';

            this.currentStory = {
                title: `ملحمة ${heroName} في ${currentSetting.name}`,
                content: story,
                date: new Date().toLocaleDateString('ar-EG'),
                genre: genre
            };

            this.updateSchemaForSEO(this.currentStory);

        }, 800);
    }

    typeWriterEffect(text, element) {
        let i = 0;
        element.textContent = '';
        const progressBar = document.getElementById('progressBar');
        const chunkSize = 4;
        
        const type = () => {
            if (i < text.length) {
                const chunk = text.substring(i, i + chunkSize);
                element.textContent += chunk;
                i += chunkSize;
                element.scrollTop = element.scrollHeight;
                
                const progress = Math.min((i / text.length) * 100, 100);
                progressBar.style.width = `${progress}%`;
                progressBar.setAttribute('aria-valuenow', Math.round(progress));
                
                requestAnimationFrame(type);
            } else {
                progressBar.style.width = '0%';
                progressBar.setAttribute('aria-valuenow', 0);
            }
        };
        requestAnimationFrame(type);
    }

    updateSchemaForSEO(story) {
        const schema = {
            "@context": "https://schema.org",
            "@type": "Article",
            "headline": story.title,
            "author": { "@type": "Organization", "name": "المحرك الملحمي للسرد العربي" },
            "datePublished": new Date().toISOString(),
            "description": `قصة ${story.genre} طويلة وفخمة حول ${story.title}.`,
            "articleBody": story.content,
            "inLanguage": "ar"
        };
        const scriptTag = document.getElementById('dynamic-schema');
        scriptTag.textContent = JSON.stringify(schema);
    }

    copyStory() { 
        const text = document.getElementById('epicOutput').textContent; 
        navigator.clipboard.writeText(text).then(() => this.showNotification('✅ تم نسخ القصة الملحمية بنجاح!'))
          .catch(() => this.showNotification('❌ حدث خطأ أثناء النسخ'));
    }

    downloadTXT() { 
        const text = document.getElementById('epicOutput').textContent; 
        const blob = new Blob([text], {type:'text/plain;charset=utf-8'}); 
        const link = document.createElement('a'); 
        link.href = URL.createObjectURL(blob); 
        const title = this.currentStory ? this.currentStory.title.replace(/[^\w\s\u0600-\u06FF]/g, '') : 'ملحمة';
        link.download = `قصة_${title}.txt`; 
        link.click();
        URL.revokeObjectURL(link.href);
    }

    shareStory() { 
        const text = document.getElementById('epicOutput').textContent.substring(0, 300) + '...\n\n(تم إنشاؤها بواسطة المحرك الملحمي للسرد العربي)'; 
        if (navigator.share) { 
            navigator.share({title:'قصتي الملحمية', text:text}).catch(()=>{}); 
        } else { 
            navigator.clipboard.writeText(text); 
            this.showNotification('✅ تم نسخ مقتطف من القصة للمشاركة!'); 
        } 
    }

    toggleTheme() { 
        document.body.classList.toggle('light-mode'); 
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark'); 
    }

    initTheme() {
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
    }

    saveToLibrary() { 
        if (!this.currentStory) return; 
        let library = [];
        try { library = JSON.parse(localStorage.getItem('epicLibrary') || '[]'); } 
        catch (e) { console.error("خطأ في قراءة المكتبة", e); }
        
        if (library.some(s => s.title === this.currentStory.title)) {
            this.showNotification('⚠️ هذه القصة محفوظة بالفعل في مكتبتك!');
            return;
        }

        library.unshift(this.currentStory); 
        if (library.length > 20) library.pop(); 
        
        try {
            localStorage.setItem('epicLibrary', JSON.stringify(library)); 
            this.showNotification('✅ تم حفظ القصة في مكتبتك الخاصة بنجاح!'); 
            this.renderLibrary();
        } catch (e) {
            if (e.name === 'QuotaExceededError') {
                this.showNotification('❌ مساحة التخزين ممتلئة! احذف بعض القصص القديمة.');
            } else {
                this.showNotification('❌ حدث خطأ أثناء الحفظ.');
            }
        }
    }

    toggleLibrary() { 
        const section = document.getElementById('librarySection'); 
        section.classList.toggle('show'); 
        if (section.classList.contains('show')) this.renderLibrary(); 
    }

    renderLibrary() { 
        const list = document.getElementById('libraryList'); 
        let library = [];
        try { library = JSON.parse(localStorage.getItem('epicLibrary') || '[]'); } 
        catch(e) { library = []; }
        
        list.innerHTML = ''; 
        if (library.length === 0) { 
            list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">لا توجد قصص محفوظة بعد. ابدأ بنسج ملحمتك الأولى!</div>'; 
            return; 
        } 
        
        library.forEach((story, index) => { 
            const item = document.createElement('div'); 
            item.className = 'library-item'; 
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'library-item-title';
            titleDiv.textContent = story.title;
            
            const dateDiv = document.createElement('div');
            dateDiv.className = 'library-item-date';
            dateDiv.textContent = `${story.date} • ${story.genre}`;
            
            const textContainer = document.createElement('div');
            textContainer.appendChild(titleDiv);
            textContainer.appendChild(dateDiv);
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
            deleteBtn.setAttribute('aria-label', 'حذف القصة');
            deleteBtn.onclick = (e) => { e.stopPropagation(); this.deleteFromLibrary(index); };
            
            item.appendChild(textContainer);
            item.appendChild(deleteBtn);
            
            item.onclick = () => {
                document.getElementById('epicOutput').textContent = story.content;
                document.getElementById('epicOutput').classList.add('show');
                document.getElementById('actionButtons').style.display = 'flex';
                this.currentStory = story;
                window.scrollTo({top: document.querySelector('.container').offsetTop, behavior:'smooth'});
            }; 
            
            list.appendChild(item); 
        }); 
    }

    deleteFromLibrary(index) {
        let library = JSON.parse(localStorage.getItem('epicLibrary') || '[]');
        library.splice(index, 1);
        localStorage.setItem('epicLibrary', JSON.stringify(library));
        this.renderLibrary();
        this.showNotification('🗑️ تم حذف القصة من المكتبة');
    }

    showNotification(message) {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.textContent = message;
        toast.style.cssText = `
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); color: var(--primary); border: 1px solid var(--primary);
            padding: 12px 24px; border-radius: 50px; font-weight: bold; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: fadeUp 0.3s ease;
            font-family: 'Cairo', sans-serif; pointer-events: none;
        `;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s';
            setTimeout(() => toast.remove(), 500);
        }, 2500);
    }
}

const app = new EpicStoryEngine();
</script>
