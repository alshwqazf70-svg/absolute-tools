    getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    updateCounter() {
        document.getElementById('jokeCounter').textContent = `  ${this.jokeCount}  `;
    }

    generateStoryJoke() {
        const loader = document.getElementById('loader');
        const outputBox = document.getElementById('jokeOutput');
        const actionButtons = document.getElementById('actionButtons');
        const generateBtn = document.getElementById('generateBtn');

        outputBox.classList.remove('show');
        actionButtons.style.display = 'none';
        loader.style.display = 'block';
        generateBtn.disabled = true;
        generateBtn.setAttribute('aria-busy', 'true');

        setTimeout(() => {
            let joke, signature;
            let attempt = 0;
            
            do {
                joke = this.getRandom(this.jokeBank);
                signature = joke.substring(0, 50);
                attempt++;
            } while (this.jokeHistory.has(signature) && attempt < 100);

            this.jokeHistory.add(signature);
            if (this.jokeHistory.size > 1000) {
                const arr = Array.from(this.jokeHistory);
                this.jokeHistory = new Set(arr.slice(-500));
            }

            this.jokeCount++;
            try { localStorage.setItem('totalJokesGenerated', this.jokeCount); } catch (e) {}
            this.updateCounter();
            
            loader.style.display = 'none';
            generateBtn.disabled = false;
            generateBtn.setAttribute('aria-busy', 'false');

            this.typeWriterEffect(joke, outputBox);
            actionButtons.style.display = 'flex';

            this.currentJoke = {
                title: ` ${this.jokeCount}`,
                content: joke,
                date: new Date().toLocaleDateString('ar-EG'),
                word: ''
            };

            this.updateSchemaForSEO(this.currentJoke);
        }, 400);
    }

    typeWriterEffect(text, element) {
        let i = 0;
        element.textContent = '';
        element.classList.add('show');
        const progressBar = document.getElementById('progressBar');
        const chunkSize = 3;
        
        const type = () => {
            if (i < text.length) {
                element.textContent += text.substring(i, i + chunkSize);
                i += chunkSize;
                element.scrollTop = element.scrollHeight;
                const progress = Math.min((i / text.length) * 100, 100);
                progressBar.style.width = `${progress}%`;
                requestAnimationFrame(type);
            } else {
                progressBar.style.width = '0%';
            }
        };
        requestAnimationFrame(type);
    }

    updateSchemaForSEO(joke) {
        const schema = {
            "@context": "https://schema.org",
            "@type": "Article",
            "headline": joke.title,
            "author": { "@type": "Organization", "name": " " },
            "datePublished": new Date().toISOString(),
            "description": "   .",
            "articleBody": joke.content,
            "inLanguage": "ar",
            "genre": "Comedy"
        };
        const scriptTag = document.getElementById('dynamic-schema');
        if (scriptTag) scriptTag.textContent = JSON.stringify(schema);
    }

    copyJoke() {
        navigator.clipboard.writeText(document.getElementById('jokeOutput').textContent)
            .then(() => this.showNotification('   !'))
            .catch(() => this.showNotification('  '));
    }

    saveJoke() {
        if (!this.currentJoke) return;
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('jokeLibrary') || '[]'); } catch (e) { saved = []; }
        if (saved.some(s => s.content === this.currentJoke.content)) {
            this.showNotification('  !'); return;
        }
        saved.unshift({ id: Date.now(), word: this.currentJoke.word, date: new Date().toLocaleString('ar-SA'), content: this.currentJoke.content });
        if (saved.length > 50) saved.pop();
        try {
            localStorage.setItem('jokeLibrary', JSON.stringify(saved));
            this.showNotification('  !');
            this.displaySavedJokes();
        } catch (e) { this.showNotification('  !'); }
    }

    downloadJokeImage() {
        if (typeof html2canvas === 'undefined') { this.showNotification('   '); return; }
        this.showNotification('  ...');
        html2canvas(document.getElementById('jokeOutput'), {
            backgroundColor: getComputedStyle(document.body).getPropertyValue('--bg-dark').trim(), scale: 2
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            this.showNotification('  !');
        }).catch(() => this.showNotification(' '));
    }

    shareJoke() {
        const text = document.getElementById('jokeOutput').textContent + '\n\n(  )';
        if (navigator.share) { navigator.share({ title: ' ', text }).catch(() => {}); }
        else { navigator.clipboard.writeText(text); this.showNotification('   !'); }
    }

    playLaugh() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const dur = 1.5, sr = ctx.sampleRate, buf = ctx.createBuffer(1, sr * dur, sr), d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) {
                const t = i / sr;
                d[i] = Math.sign(Math.sin(2 * Math.PI * (200 + Math.sin(t * 30) * 150) * t)) * Math.sin(t * Math.PI / dur) * (0.5 + 0.5 * Math.sin(t * 20)) * 0.3;
            }
            const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination); s.start();
            setTimeout(() => ctx.close(), dur * 1000 + 100);
            this.showNotification('   !');
        } catch (e) { this.showNotification('   !'); }
    }

    displaySavedJokes() {
        const container = document.getElementById('savedStoriesContainer');
        const list = document.getElementById('savedStoriesList');
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('jokeLibrary') || '[]'); } catch(e) { saved = []; }
        if (saved.length === 0) { container.style.display = 'none'; return; }
        container.style.display = 'block';
        list.innerHTML = '';
        saved.forEach(s => {
            const item = document.createElement('div');
            item.className = 'story-item';
            const header = document.createElement('div');
            header.innerHTML = `<strong> </strong> | <small>${s.date}</small>`;
            const del = document.createElement('button');
            del.className = 'delete-btn';
            del.innerHTML = '<i class="fas fa-trash"></i>';
            del.onclick = (e) => { e.stopPropagation(); this.deleteJoke(s.id); };
            const p = document.createElement('p');
            p.style.marginTop = '8px';
            p.textContent = s.content;
            item.appendChild(del); item.appendChild(header); item.appendChild(p);
            item.onclick = () => {
                document.getElementById('jokeOutput').textContent = s.content;
                document.getElementById('jokeOutput').classList.add('show');
                document.getElementById('actionButtons').style.display = 'flex';
                this.currentJoke = { title: '', content: s.content, word: s.word };
                window.scrollTo({top: document.querySelector('.container').offsetTop, behavior:'smooth'});
            };
            list.appendChild(item);
        });
    }

    deleteJoke(id) {
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('jokeLibrary') || '[]'); } catch(e) { return; }
        saved = saved.filter(s => s.id !== id);
        try { localStorage.setItem('jokeLibrary', JSON.stringify(saved)); } catch(e) {}
        this.displaySavedJokes();
        this.showNotification('  ');
    }

    exportCSV() {
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('jokeLibrary') || '[]'); } catch(e) { saved = []; }
        if (saved.length === 0) { this.showNotification('    '); return; }
        let csv = "\uFEFF,\n";
        saved.forEach(i => { csv += `"${i.date}","${i.content.replace(/"/g, '""')}"\n`; });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '_.csv';
        link.click();
        URL.revokeObjectURL(link.href);
        this.showNotification('  !');
    }

    showNotification(message) {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.5s'; setTimeout(() => toast.remove(), 500); }, 2500);
    }

    toggleTheme() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('jokeTheme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    initTheme() {
        if (localStorage.getItem('jokeTheme') === 'light') document.body.classList.add('light-mode');
    }
}

const app = new JokeEngine();
window.onload = function() { app.displaySavedJokes(); };
