    normalizeText(text) {
        return text.trim().toLowerCase()
            .replace(/^ال/, '') // إزالة "ال" التعريف من البداية
            .replace(/\s+/g, '') // إزالة جميع المسافات
            .replace(/[أإآ]/g, 'ا') // توحيد الهمزات
            .replace(/ة/g, 'ه'); // توحيد التاء المربوطة (اختياري، لكن مفيد)
    }

    getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    updateXPUI() {
        document.getElementById('playerXP').textContent = this.xp;
        document.getElementById('progressDisplay').textContent = `تم حل ${this.solvedCount} لغز`;
        try {
            localStorage.setItem('riddleXP', this.xp);
            localStorage.setItem('riddleSolvedCount', this.solvedCount);
        } catch (e) { console.warn("فشل حفظ النقاط", e); }
    }

    addXP(v) { 
        this.xp = Math.max(0, this.xp + v); 
        this.updateXPUI(); 
    }

    getNewRiddle() {
        let riddle;
        let attempts = 0;
        do {
            riddle = this.getRandom(this.riddleBank);
            attempts++;
            // منع التكرار حتى نستخدم 90% من البنك
        } while (this.usedRiddles.has(riddle.q) && attempts < 100 && this.usedRiddles.size < this.riddleBank.length * 0.9);

        // تنظيف الذاكرة إذا كبرت المجموعة
        if (this.usedRiddles.size > 100) {
            const arr = Array.from(this.usedRiddles);
            this.usedRiddles = new Set(arr.slice(-50));
        }
        
        return riddle;
    }

        const progressBar = document.getElementById('progressBar');
        const chunkSize = 2;
        
        const type = () => {
            if (i < text.length) {
                element.textContent += text.substring(i, i + chunkSize);
                i += chunkSize;
                const progress = Math.min((i / text.length) * 100, 100);
                progressBar.style.width = `${progress}%`;
                progressBar.setAttribute('aria-valuenow', Math.round(progress));
                requestAnimationFrame(type);
            } else {
                progressBar.style.width = '0%';
                progressBar.setAttribute('aria-valuenow', 0);
            }
        };
        requestAnimationFrame(type);
    }

    checkAnswer() {
        const inputEl = document.getElementById('userAnswer');
        const userInput = inputEl.value.trim();
        const fb = document.getElementById('feedbackMessage');
        const checkBtn = document.getElementById('checkBtn');

        if (!userInput) {
            fb.className = 'feedback error';
            fb.textContent = '⚠️ اكتب إجابتك أولاً!';
            this.playSound('error');
            return;
        }

        checkBtn.disabled = true;

        // استخدام نظام التطبيع الذكي للمقارنة
        const normalizedUser = this.normalizeText(userInput);
        const normalizedAnswer = this.normalizeText(this.currentRiddle.a);

        // قبول الإجابة إذا كانت مطابقة، أو إذا كانت الإجابة الصحيحة تحتوي على إجابة المستخدم (للمرونة)
        if (normalizedUser === normalizedAnswer || normalizedAnswer.includes(normalizedUser) && normalizedUser.length > 2) {
            this.solvedCount++;
            this.addXP(3);
            fb.className = 'feedback success';
            fb.textContent = `🎉 إجابة صحيحة! الإجابة هي: "${this.currentRiddle.a}" (+3 XP)`;
            this.playSound('success');
            this.saveHistory(true);
            
            setTimeout(() => {
                this.displayRiddle();
            }, 2000);
        } else {
            fb.className = 'feedback error';
            fb.textContent = '❌ إجابة خاطئة، حاول مجدداً أو استخدم تلميحاً.';
            this.playSound('error');
            this.saveHistory(false);
            checkBtn.disabled = false;
        }
    }

    useHint() {
        const fb = document.getElementById('feedbackMessage');
        if (this.xp < 1) {
            fb.className = 'feedback error';
            fb.textContent = '⚠️ لا تملك نقاطاً كافية للتلميح!';
            return;
        }

        this.addXP(-1);
        this.hintLevel++;
        const answer = this.currentRiddle.a;
        
        if (this.hintLevel === 1) {
            fb.className = 'feedback success';
            fb.textContent = `💡 التلميح: الإجابة تتكون من ${answer.length} أحرف، وتبدأ بـ "${answer.charAt(0)}"`;
        } else if (this.hintLevel === 2) {
            fb.className = 'feedback success';
            fb.textContent = `💡 تلميح أقوى: الحرف الثاني هو "${answer.charAt(1) || '...'}"`;
        } else {
            fb.className = 'feedback success';
            fb.textContent = `💡 الإجابة هي: ${answer}`;
        }
    }

    copyRiddle() {
        const text = `🧩 لغز: ${this.currentRiddle.q}\n\nمن: اللغز التطوري`;
        navigator.clipboard.writeText(text).then(() => {
            this.showNotification('✅ تم نسخ اللغز بنجاح!');
        }).catch(() => {
            this.showNotification('❌ حدث خطأ أثناء النسخ');
        });
    }

    saveRiddle() {
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('savedRiddles') || '[]'); } catch (e) { saved = []; }
        
        if (saved.some(s => s.q === this.currentRiddle.q)) {
            this.showNotification('⚠️ هذا اللغز محفوظ بالفعل!');
            return;
        }

        saved.unshift({ q: this.currentRiddle.q, a: this.currentRiddle.a, date: new Date().toLocaleString('ar-SA') });
        if (saved.length > 20) saved.pop();
        
        try {
            localStorage.setItem('savedRiddles', JSON.stringify(saved));
            this.showNotification('💾 تم حفظ اللغز في مكتبتك!');
        } catch (e) {
            this.showNotification('❌ مساحة التخزين ممتلئة!');
        }
    }

    downloadRiddleImage() {
        if (typeof html2canvas === 'undefined') {
            this.showNotification('⏳ جاري تحميل مكتبة الصور، حاول مرة أخرى بعد ثانية.');
            return;
        }
        
        this.showNotification('⏳ جاري تحويل اللغز إلى صورة...');
        const el = document.getElementById('riddleDisplay');
        const isDark = !document.body.classList.contains('light-mode');
        
        html2canvas(el, { 
            backgroundColor: isDark ? '#1b212b' : '#e8eef2',
            scale: 2,
            logging: false
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `لغز_تطوري_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            this.showNotification('✅ تم تحميل الصورة بنجاح!');
        }).catch(() => {
            this.showNotification('❌ فشل إنشاء الصورة.');
        });
    }

    saveHistory(success) {
        this.history.unshift({ 
            q: this.currentRiddle.q.substring(0, 40) + '...', 
            result: success ? '✅' : '❌',
            time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })
        });
        if (this.history.length > 10) this.history.pop();
        
        try {
            localStorage.setItem('riddleHistory', JSON.stringify(this.history));
        } catch (e) {}
        this.renderHistory();
    }

    renderHistory() {
        const box = document.getElementById('historyBox');
        const list = document.getElementById('historyList');
        if (this.history.length === 0) { box.style.display = 'none'; return; }
        
        box.style.display = 'block';
        list.innerHTML = '';
        this.history.forEach(h => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span>${h.result} ${h.q}</span> <span style="color:var(--text-muted);font-size:0.8rem;">${h.time}</span>`;
            list.appendChild(item);
        });
    }

    playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = type === 'success' ? 800 : 250;
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.3);
            setTimeout(() => ctx.close(), 400);
        } catch(e) {}
    }

    showNotification(message) {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();
        
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s';
            setTimeout(() => toast.remove(), 500);
        }, 2500);
    }

    updateSchemaForSEO(riddle) {
        const schema = {
            "@context": "https://schema.org",
            "@type": "Question",
            "name": riddle.q,
            "acceptedAnswer": {
                "@type": "Answer",
                "text": riddle.a
            }
        };
        const scriptTag = document.getElementById('dynamic-schema');
        if (scriptTag) scriptTag.textContent = JSON.stringify(schema);
    }

    toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('riddleTheme', isLight ? 'light' : 'dark');
    }

    initTheme() {
        if (localStorage.getItem('riddleTheme') === 'light') {
            document.body.classList.add('light-mode');
        }
    }
}

// تهيئة التطبيق
const app = new RiddleEngine();
window.onload = function() {
    app.displayRiddle();
    
    // السماح بالضغط على Enter للإجابة
    document.getElementById('userAnswer').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            app.checkAnswer();
        }
    });
};
</script>
