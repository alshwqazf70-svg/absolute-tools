        const progressBar = document.getElementById('progressBar');

        outputBox.classList.remove('show');
        actionButtons.style.display = 'none';
        loader.style.display = 'block';
        generateBtn.disabled = true;
        generateBtn.setAttribute('aria-busy', 'true');
        progressBar.style.width = '30%';

        setTimeout(() => {
            let title, description, signature;
            let attempt = 0;

            do {
                const prefix = this.getRandom(this.prefixes);
                const adj = this.getRandom(this.adjectives);
                const domain = this.getRandom(data.domains);
                const target = this.getRandom(data.audiences);
                const model = this.getRandom(this.bizModels);
                const adv = this.getRandom(this.advantages);
                const step1 = this.getRandom(this.steps);
                const step2 = this.getRandom(this.steps.filter(s => s !== step1));

                const keywordTouch = keyword ? ` مستوحى من "${keyword}"` : '';
                const keywordInDomain = keyword ? `${domain} المرتبط بـ ${keyword}` : domain;
                
                title = `${prefix} ${adj} لـ ${keywordInDomain}${keywordTouch}`;

                description = `
                    <span class="highlight">📌 اسم المشروع:</span>
                    <span class="highlight2">${title}</span>
                    
                    <span class="highlight">📝 وصف الفكرة (Elevator Pitch):</span>
                    ${prefix} ${adj} يهدف إلى خدمة <strong>${target}</strong> في مجال <strong>${domain}</strong> عبر تقديم حلول مبتكرة. المشروع يتميز بـ <strong>${adv}</strong> مما يجعله الخيار الأمثل للفئة المستهدفة ويحل مشكلة حقيقية في السوق.
                    
                    <span class="highlight">🎯 الجمهور المستهدف:</span>
                    ${target}، بالإضافة إلى المهتمين بـ ${domain} والبحث عن حلول ${adj === 'رقمي' ? 'رقمية' : 'عصرية'}.
                    
                    <span class="highlight">💰 نموذج الربح:</span>
                    ${model}.
                    
                    <span class="highlight">⭐ الميزة التنافسية:</span>
                    ${adv}. ${keyword ? `الربط الوثيق بمفهوم "${keyword}" يمنح المشروع طابعاً فريداً وصعوبة في التقليد.` : ''}
                    
                    <span class="highlight">🚀 خطوات التنفيذ الأولى:</span>
                    • ${step1}<br>
                    • ${step2}<br>
                    • بناء نموذج أولي (MVP) وعرضه على 10 عملاء محتملين للحصول على ملاحظات فورية.
                    
                    <br><span style="color: var(--text-muted); font-size:0.9rem; border-top: 1px solid var(--border-color); padding-top: 10px; display: block;">🏷️ المجال: ${data.tag} | تم التوليد بواسطة المحرك الريادي</span>
                `;

                signature = `${title}|${target}|${domain}`;
                attempt++;
            } while (this.ideaHistory.has(signature) && attempt < 100);

            this.ideaHistory.add(signature);
            if (this.ideaHistory.size > 500) {
                const arr = Array.from(this.ideaHistory);
                this.ideaHistory = new Set(arr.slice(-250));
            }

            this.ideaCount++;
            try { localStorage.setItem('totalIdeasGenerated', this.ideaCount); } catch (e) {}
            this.updateCounter();
            
            progressBar.style.width = '80%';
            
            outputBox.innerHTML = '';
            outputBox.classList.add('show');
            loader.style.display = 'none';
            generateBtn.disabled = false;
            generateBtn.setAttribute('aria-busy', 'false');
            progressBar.style.width = '100%';
            setTimeout(() => { progressBar.style.width = '0%'; }, 300);

            // Fast, safe HTML reveal (better than char-by-char for complex HTML)
            outputBox.innerHTML = description;
            actionButtons.style.display = 'flex';

            this.currentIdea = {
                title: title,
                content: description,
                textContent: outputBox.innerText, // For copying
                date: new Date().toLocaleDateString('ar-EG'),
                keyword: keyword || data.tag
            };

            this.updateSchemaForSEO(this.currentIdea);

        }, 600);
    }

    updateSchemaForSEO(idea) {
        const schema = {
            "@context": "https://schema.org",
            "@type": "Article",
            "headline": idea.title,
            "author": { "@type": "Organization", "name": "الأدوات المطلقة" },
            "datePublished": new Date().toISOString(),
            "description": `فكرة مشروع ريادي في مجال ${idea.keyword}: ${idea.title}`,
            "articleBody": idea.textContent,
            "inLanguage": "ar",
            "genre": "BusinessIdea"
        };
        const scriptTag = document.getElementById('dynamic-schema');
        if (scriptTag) scriptTag.textContent = JSON.stringify(schema);
    }

    copyIdea() {
        if (!this.currentIdea) return;
        navigator.clipboard.writeText(this.currentIdea.textContent)
            .then(() => this.showToast('✅ تم نسخ خطة العمل بنجاح!'))
            .catch(() => this.showToast('❌ حدث خطأ أثناء النسخ'));
    }

    saveIdea() {
        if (!this.currentIdea) return;
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('ideaLibrary') || '[]'); } catch (e) { saved = []; }
        
        if (saved.some(s => s.title === this.currentIdea.title)) {
            this.showToast('⚠️ هذه الفكرة محفوظة بالفعل!');
            return;
        }

        saved.unshift({ 
            id: Date.now(), 
            title: this.currentIdea.title,
            keyword: this.currentIdea.keyword, 
            date: this.currentIdea.date, 
            content: this.currentIdea.content 
        });
        if (saved.length > 50) saved.pop();
        
        try {
            localStorage.setItem('ideaLibrary', JSON.stringify(saved));
            this.showToast('💡 تم حفظ الفكرة في المكتبة بنجاح!');
            this.displaySavedIdeas();
        } catch (e) {
            if (e.name === 'QuotaExceededError') {
                this.showToast('❌ مساحة التخزين ممتلئة! احذف بعض الأفكار القديمة.');
            } else {
                this.showToast('❌ حدث خطأ أثناء الحفظ.');
            }
        }
    }

    downloadImage() {
        if (typeof html2canvas === 'undefined') {
            this.showToast('⏳ جاري تحميل مكتبة الصور، حاول مرة أخرى بعد ثانية.');
            return;
        }
        this.showToast('⏳ جاري تحويل الفكرة إلى صورة...');
        const outputBox = document.getElementById('ideaOutput');
        const isDark = !document.body.classList.contains('light-mode');
        
        html2canvas(outputBox, { 
            backgroundColor: isDark ? '#1a1408' : '#fffdf5',
            scale: 2,
            logging: false
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `فكرة_مشروع_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            this.showToast('✅ تم تحميل الصورة بنجاح!');
        }).catch(() => {
            this.showToast('❌ فشل إنشاء الصورة.');
        });
    }

    displaySavedIdeas() {
        const container = document.getElementById('savedIdeasContainer');
        const list = document.getElementById('savedIdeasList');
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('ideaLibrary') || '[]'); } catch(e) { saved = []; }
        
        if (saved.length === 0) { container.style.display = 'none'; return; }
        container.style.display = 'block';
        list.innerHTML = '';
        
        saved.forEach(s => {
            const item = document.createElement('div');
            item.className = 'idea-item';
            
            const header = document.createElement('div');
            header.innerHTML = `<strong>💡 ${s.title}</strong> | <small>${s.date}</small>`;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
            deleteBtn.setAttribute('aria-label', 'حذف الفكرة');
            deleteBtn.onclick = (e) => { e.stopPropagation(); this.deleteIdea(s.id); };
            
            const content = document.createElement('p');
            content.style.marginTop = '8px';
            // استخراج النص فقط للمعاينة بدون وسوم HTML
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = s.content;
            content.textContent = tempDiv.innerText.substring(0, 120) + '...';
            
            item.appendChild(deleteBtn);
            item.appendChild(header);
            item.appendChild(content);
            
            item.onclick = () => {
                document.getElementById('ideaOutput').innerHTML = s.content;
                document.getElementById('ideaOutput').classList.add('show');
                document.getElementById('actionButtons').style.display = 'flex';
                this.currentIdea = { title: s.title, content: s.content, textContent: tempDiv.innerText, keyword: s.keyword };
                window.scrollTo({top: document.querySelector('.container').offsetTop, behavior:'smooth'});
            };
            
            list.appendChild(item);
        });
    }

    deleteIdea(id) {
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('ideaLibrary') || '[]'); } catch(e) { return; }
        saved = saved.filter(s => s.id !== id);
        try { localStorage.setItem('ideaLibrary', JSON.stringify(saved)); } catch(e) {}
        this.displaySavedIdeas();
        this.showToast('🗑️ تم حذف الفكرة من المكتبة');
    }
}

// تهيئة التطبيق
const app = new ProjectIdeaEngine();
window.onload = function() {
    app.displaySavedIdeas();
};
</script>
