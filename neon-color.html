<script>
/**
 *     
 * Optimized for: Extreme Speed, Max SEO, AI Crawler Compatibility, Full Arabic Support
 */
class ColorPaletteEngine {
    constructor() {
        this.paletteCount = parseInt(localStorage.getItem('totalPalettesGenerated') || '0');
        this.currentPalette = [];
        this.updateCounter();
        this.initTheme();

        //       
        this.colorMap = {
            '': '#ff3333', '': '#0099ff', '': '#00cc44', '': '#ffdd00',
            '': '#ff66aa', '': '#aa44ff', '': '#ff8800', '': '#00ddff',
            '': '#f8f8ff', '': '#111111', '': '#808080', '': '#8b4513',
            ' ': '#ff00ff', ' ': '#00ffff', ' ': '#39ff14', ' ': '#ffff00',
            'red': '#ff3333', 'blue': '#0099ff', 'green': '#00cc44', 'yellow': '#ffdd00',
            'pink': '#ff66aa', 'purple': '#aa44ff', 'orange': '#ff8800', 'cyan': '#00ddff',
            'white': '#f8f8ff', 'black': '#111111', 'neon pink': '#ff00ff', 'neon blue': '#00ffff'
        };
    }

    updateCounter() {
        document.getElementById('paletteCounter').textContent = `  ${this.paletteCount} `;
    }

    initTheme() {
        if (localStorage.getItem('paletteTheme') === 'light') document.body.classList.add('light-mode');
    }

    toggleTheme() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('paletteTheme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    showToast(message) {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s';
            setTimeout(() => toast.remove(), 500);
        }, 2500);
    }

    //  HEX  HSL
    hexToHSL(hex) {
        let r = parseInt(hex.slice(1,3), 16) / 255;
        let g = parseInt(hex.slice(3,5), 16) / 255;
        let b = parseInt(hex.slice(5,7), 16) / 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) { h = s = 0; }
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                case g: h = ((b - r) / d + 2) / 6; break;
                case b: h = ((r - g) / d + 4) / 6; break;
            }
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }

    //  HSL  HEX
    HSLToHex(h, s, l) {
        s /= 100; l /= 100;
        const a = s * Math.min(l, 1 - l);
        const f = n => {
            const k = (n + h / 30) % 12;
            const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
    }

    updateSchema(mode) {
        const schema = {
            "@context": "https://schema.org",
            "@type": "SoftwareApplication",
            "name": `  ${mode}`,
            "description": `          ${mode}.`,
            "applicationCategory": "DesignApplication"
        };
        const scriptTag = document.getElementById('dynamic-schema');
        if (scriptTag) scriptTag.textContent = JSON.stringify(schema);
    }

    generatePalette() {
        const picker = document.getElementById('baseColorPicker').value;
        const nameInput = document.getElementById('colorNameInput').value.trim().toLowerCase();
        const mode = document.getElementById('modeSelect').value;
        const generateBtn = document.getElementById('generateBtn');
        const progressBar = document.getElementById('progressBar');

        let baseColor = this.colorMap[nameInput] || picker;
        const hsl = this.hexToHSL(baseColor);
        let palette = [];
        const count = 10;

        generateBtn.disabled = true;
        generateBtn.setAttribute('aria-busy', 'true');
        progressBar.style.width = '40%';

        setTimeout(() => {
            try {
                if (mode === 'neon') {
                    for (let i = 0; i < count; i++) palette.push(this.HSLToHex((hsl.h + i * 35) % 360, 100, 55));
                } else if (mode === 'pastel') {
                    for (let i = 0; i < count; i++) palette.push(this.HSLToHex((hsl.h + i * 30) % 360, 50, 80));
                } else if (mode === 'mono') {
                    for (let i = 0; i < count; i++) palette.push(this.HSLToHex(hsl.h, hsl.s, 15 + i * 8));
                } else if (mode === 'complementary') {
                    const compH = (hsl.h + 180) % 360;
                    for (let i = 0; i < 5; i++) {
                        palette.push(this.HSLToHex(hsl.h, hsl.s, 30 + i * 15));
                        palette.push(this.HSLToHex(compH, hsl.s, 30 + i * 15));
                    }
                }

                this.currentPalette = palette;
                this.renderPalette(palette, mode);
                
                this.paletteCount++;
                try { localStorage.setItem('totalPalettesGenerated', this.paletteCount); } catch(e) {}
                this.updateCounter();
                this.updateSchema(mode);

                progressBar.style.width = '100%';
                setTimeout(() => { progressBar.style.width = '0%'; }, 300);
                this.showToast('     !');
            } catch (error) {
                this.showToast('    ');
                console.error(error);
            } finally {
                generateBtn.disabled = false;
                generateBtn.setAttribute('aria-busy', 'false');
            }
        }, 50);
    }

    //     DocumentFragment   
    renderPalette(palette, mode) {
        const grid = document.getElementById('paletteGrid');
        grid.innerHTML = '';
        const fragment = document.createDocumentFragment();
        
        const modeNames = { 'neon': '', 'pastel': '', 'mono': '', 'complementary': '' };
        const displayName = modeNames[mode] || '';

        palette.forEach(hex => {
            const card = document.createElement('div');
            card.className = 'color-card';
            card.style.background = hex;
            card.style.boxShadow = `0 8px 30px ${hex}66`;
            card.setAttribute('role', 'listitem');
            card.setAttribute('tabindex', '0');
            card.innerHTML = `
                <span class="color-hex">${hex.toUpperCase()}</span>
                <span class="color-name">${displayName}</span>
            `;
            card.onclick = () => this.copySingle(hex, card);
            card.onkeydown = (e) => { if (e.key === 'Enter') this.copySingle(hex, card); };
            fragment.appendChild(card);
        });
        grid.appendChild(fragment);
    }

    copySingle(hex, element) {
        navigator.clipboard.writeText(hex).then(() => {
            if (element) {
                element.classList.add('copied');
                const originalHTML = element.innerHTML;
                element.innerHTML = `<span class="color-hex" style="background:rgba(255,255,255,0.9);color:#000;border:none;">  </span>`;
                setTimeout(() => {
                    element.classList.remove('copied');
                    element.innerHTML = originalHTML;
                }, 800);
            }
            this.showToast(`  : ${hex.toUpperCase()}`);
        }).catch(() => this.showToast('  '));
    }

    copyAllColors() {
        if (this.currentPalette.length === 0) { this.showToast('    '); return; }
        navigator.clipboard.writeText(this.currentPalette.join(', ')).then(() => {
            this.showToast('     !');
        }).catch(() => this.showToast('  '));
    }

    exportJSON() {
        if (this.currentPalette.length === 0) { this.showToast('    '); return; }
        const json = JSON.stringify(this.currentPalette, null, 2);
        const blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'palette.json';
        link.click();
        URL.revokeObjectURL(link.href);
        this.showToast('    JSON !');
    }

    exportCSS() {
        if (this.currentPalette.length === 0) { this.showToast('    '); return; }
        const css = ':root {\n' + this.currentPalette.map((c, i) => `  --color-${i+1}: ${c};`).join('\n') + '\n}';
        const blob = new Blob([css], { type: 'text/css;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'palette.css';
        link.click();
        URL.revokeObjectURL(link.href);
        this.showToast('    CSS !');
    }

    savePalette() {
        if (this.currentPalette.length === 0) { this.showToast('    '); return; }
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem('colorPalettes') || '[]'); } catch (e) { saved = []; }
        
        saved.unshift({ date: new Date().toLocaleString('ar-SA'), colors: this.currentPalette });
        if (saved.length > 20) saved.pop();
        
        try {
            localStorage.setItem('colorPalettes', JSON.stringify(saved));
            this.showToast('      !');
        } catch (e) {
            if (e.name === 'QuotaExceededError') this.showToast('   !');
            else this.showToast('    .');
        }
    }

    downloadImage() {
        if (typeof html2canvas === 'undefined') {
            this.showToast('         .');
            return;
        }
        this.showToast('     ...');
        const grid = document.getElementById('paletteGrid');
        const isDark = !document.body.classList.contains('light-mode');
        
        html2canvas(grid, { 
            backgroundColor: isDark ? '#12121a' : '#ffffff',
            scale: 2,
            logging: false
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `__${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            this.showToast('    !');
        }).catch(() => this.showToast('   .'));
    }

    randomColor() {
        const randomHex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        document.getElementById('baseColorPicker').value = randomHex;
        document.getElementById('colorNameInput').value = '';
        this.generatePalette();
    }
}

//  
const app = new ColorPaletteEngine();
window.onload = function() {
    app.generatePalette();
};
</script>
